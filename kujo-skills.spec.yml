name: "Kujo skills technical preview"
goal: "Ship a portable, reviewable, and accurately documented 0.4.0 skills distribution with a stage-gated Kujo ecosystem launch coordinator."
version: "0.4.0"
status: "ready"
priority: "high"
scope: "Public README and support docs, skill routing fixtures, portable local and CI validation, and Workcell launch evidence."
non_goals:
  - "Marketplace publication"
  - "Automatic installation into live agent profiles"
  - "Runtime enforcement of skill instructions"
acceptance_criteria:
  - "All 95 skill folders pass portable frontmatter and routing validation"
  - "README, VERSION, package metadata, changelog, and MIT license agree on the 0.4.0 baseline"
  - "Local Markdown links and clean temporary-profile installation validate"
  - "ShipCheck has no error-level release blockers"
  - "Workcell verifies the five required launch-batch skills in a no-network container"
eval_requirements:
  - description: "The portable release-readiness script succeeds"
    check_type: "command_succeeds"
    params:
      command: "bash tests/release-readiness.sh"
  - description: "The MIT license exists"
    check_type: "file_exists"
    params:
      path: "LICENSE"
  - description: "The skills-pack version is declared"
    check_type: "file_contains"
    params:
      path: "VERSION"
      expected: "0.4.0"
risks:
  - risk: "Source tool behavior may drift after this skills-pack release"
    mitigation: "Run recurring Concord and skill audits against source repositories"
    severity: "medium"
  - risk: "Third-party agents may ignore or partially apply skill instructions"
    mitigation: "Keep the runtime-enforcement boundary explicit in public documentation"
    severity: "medium"
human_approval_points:
  - "Marketplace publication"
  - "Public release tag creation"

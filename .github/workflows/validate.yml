name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  skills-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Validate release readiness
        run: bash tests/release-readiness.sh
      - name: Verify clean installation
        run: bash tests/clean-checkout.sh
